<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Les Coulisses du Théâtre — Restaurant Map</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Leaflet rotation plugin -->
<script src="https://cdn.jsdelivr.net/npm/leaflet-rotate@0.2.8/dist/leaflet-rotate-src.js"></script>
<style>
  :root {
    --cream: #FAF7F2;
    --ink:   #1A1713;
    --gold:  #C9A84C;
    --gold-light: #E8D5A3;
    --hotel: #8B5CF6;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--ink);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── PRINT STYLES ── */
  @media print {
    @page {
      size: A4 landscape;
      margin: 10mm;
    }
    body {
      height: 100%;
      overflow: visible;
    }
    .header {
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    #map {
      height: calc(100vh - 52px);
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .leaflet-control-zoom,
    .leaflet-control-attribution {
      display: none !important;
    }
  }

  /* ── SLIM HEADER ── */
  .header {
    background: var(--ink);
    color: var(--cream);
    padding: 10px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 2.5px solid var(--gold);
    flex-shrink: 0;
  }
  .header-left {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .header-left h1 {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    letter-spacing: 0.02em;
    line-height: 1;
    color: var(--gold);
  }
  .header-left h1 em { font-style: normal; color: var(--gold); }
  .header-left span {
    font-size: 10px;
    font-weight: 300;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #6B7280;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .header-address {
    text-align: right;
    font-size: 10px;
    color: #9CA3AF;
    letter-spacing: 0.05em;
    line-height: 1.5;
  }
  .header-address strong {
    color: var(--gold-light);
    font-family: 'Playfair Display', serif;
    font-size: 11px;
    font-weight: 500;
  }
  .print-btn {
    background: transparent;
    border: 1.5px solid var(--gold);
    color: var(--gold-light);
    font-family: 'DM Sans', sans-serif;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 5px 12px;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.2s;
    white-space: nowrap;
  }
  .print-btn:hover { background: rgba(201,168,76,0.15); }
  @media print { .print-btn { display: none; } }

  /* ── MAP ── */
  #map {
    flex: 1;
    width: 100%;
    z-index: 1;
  }

  /* ── POPUP ── */
  .leaflet-popup-content-wrapper {
    border-radius: 8px !important;
    border: 1.5px solid var(--gold) !important;
    box-shadow: 0 8px 28px rgba(0,0,0,0.22) !important;
    padding: 0 !important;
    overflow: hidden;
  }
  .leaflet-popup-content { margin: 0 !important; width: 230px !important; }
  .leaflet-popup-tip { background: var(--ink) !important; }

  .popup-inner {
    padding: 14px 16px;
    background: var(--ink);
    color: var(--cream);
  }
  .popup-num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px; height: 22px;
    border-radius: 50%;
    font-size: 10px; font-weight: 700;
    color: #fff;
    margin-bottom: 6px;
  }
  .popup-inner h4 {
    font-family: 'Playfair Display', serif;
    font-size: 15px;
    color: var(--gold-light);
    line-height: 1.2;
    margin-bottom: 3px;
  }
  .popup-type { font-size: 11px; color: #9CA3AF; }
  .popup-dist {
    margin-top: 8px;
    font-size: 12px;
    font-weight: 500;
    color: var(--gold-light);
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .popup-addr {
    margin-top: 4px;
    font-size: 10.5px;
    color: #9CA3AF;
    display: flex;
    align-items: flex-start;
    gap: 4px;
    line-height: 1.4;
  }
  .popup-hotel h4 { color: #A78BFA; }
</style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <h1>Les Coulisses <em>du Théâtre</em></h1>
    <span>Restaurant Guide · Saint-Quentin</span>
  </div>
  <div class="header-right">
    <div class="header-address">
      <strong>8 Rue de la Comédie</strong><br>
      02100 Saint-Quentin &nbsp;·&nbsp; +33 3 23 67 90 09
    </div>
  </div>
</header>

<div id="map"></div>

<script>
/* Rue de la Comédie runs at ~72° bearing — rotate map 18° clockwise
   so the street appears perfectly horizontal on screen */
const BEARING = -22;

const map = L.map('map', {
  center: [49.8455, 3.2903],
  zoom: 16,
  rotate: true,
  bearing: BEARING,
  touchRotate: false,
  rotateControl: false,
});

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://openstreetmap.org">OpenStreetMap</a> contributors',
  maxZoom: 19
}).addTo(map);

/* ── Marker helpers ── */
function circleMarker(color, label) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="34" height="34">
    <circle cx="17" cy="17" r="14" fill="${color}" stroke="white" stroke-width="2.5"/>
    <text x="17" y="22" text-anchor="middle" fill="white" font-size="11"
          font-family="DM Sans,sans-serif" font-weight="700">${label}</text>
  </svg>`;
  return L.divIcon({ html: svg, className: '', iconSize: [34,34], iconAnchor: [17,17], popupAnchor: [0,-17] });
}

/* ── No hotel marker ── */

function entranceIcon() {
  /* Simple purple hotel pin matching the original style */
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="26" height="32" viewBox="0 0 26 32">
    <ellipse cx="13" cy="30" rx="5" ry="3" fill="rgba(0,0,0,0.2)"/>
    <path d="M13 1 C7 1 3 7 3 12 C3 21 13 30 13 30 C13 30 23 21 23 12 C23 7 19 1 13 1Z"
          fill="#8B5CF6" stroke="white" stroke-width="2"/>
    <text x="13" y="15.5" text-anchor="middle" fill="white" font-size="9"
          font-family="DM Sans,sans-serif" font-weight="700">H</text>
  </svg>`;
  return L.divIcon({ html: svg, className: '', iconSize: [26,32], iconAnchor: [13,30], popupAnchor: [0,-30] });
}

/* ── Hotel marker — exact GPS from hotel website ── */
L.marker([49.846108, 3.286268], { icon: entranceIcon() }).addTo(map)
  .bindPopup(`
    <div class="popup-inner popup-hotel">
      <h4>🏨 Les Coulisses du Théâtre</h4>
      <p class="popup-type">8 Rue de la Comédie, 02100 Saint-Quentin</p>
      <div class="popup-dist" style="color:#A78BFA">📍 Votre point de départ</div>
    </div>`);

/* ── Restaurants ── */
const restaurants = [
  { lat:49.8463821, lng:3.2870141, name:"Le Petit Chef",      color:"#3B82F6", dist:"~150 m · 2 min",  type:"Cuisine française",        addr:"33 Place de l'Hôtel de Ville" },
  { lat:49.846750,  lng:3.2881957, name:"L'Edito",            color:"#3B82F6", dist:"~180 m · 2 min",  type:"Brasserie",                addr:"10 Place de l'Hôtel de Ville" },
  { lat:49.8458901, lng:3.2878531, name:"Ô DiVin",            color:"#3B82F6", dist:"~200 m · 3 min",  type:"Bar à vins & tapas",       addr:"22 Place de l'Hôtel de Ville" },
  { lat:49.8461223, lng:3.2845714, name:"Chez Mario",         color:"#22C55E", dist:"~120 m · 2 min",  type:"Restaurant italien",       addr:"1 Rue Renan" },
  { lat:49.8473421, lng:3.2871744, name:"Le Golden Pub",      color:"#22C55E", dist:"~250 m · 4 min",  type:"Pub & pizzas",             addr:"3 Rue Croix Belle Porte" },
  { lat:49.8466849, lng:3.2894422, name:"Chez Jean",          color:"#22C55E", dist:"~200 m · 3 min",  type:"Gastronomie française",    addr:"4bis Rue de Lyon" },
  { lat:49.849591,  lng:3.2918057, name:"Les Champs-Élysées", color:"#EAB308", dist:"~380 m · 5 min",  type:"Cuisine traditionnelle",   addr:"68 Rue de Baudreuil" },
  { lat:49.8457855, lng:3.2904155, name:"Umami",              color:"#EAB308", dist:"~320 m · 4 min",  type:"Restaurant japonais",      addr:"6 Rue de la Sous-Préfecture" },
  { lat:49.846683,  lng:3.2947789, name:"La Maison S&L",      color:"#EF4444", dist:"~700 m · 9 min",  type:"Gastronomique",            addr:"132 Rue de Baudreuil" },
  { lat:49.8427006, lng:3.2948394, name:"Le Huit",            color:"#EF4444", dist:"~900 m · 11 min", type:"Restaurant gastronomique", addr:"3 Place du Huit Octobre" },
  { lat:49.8432579, lng:3.293329,  name:"Villa d'Isle",       color:"#EF4444", dist:"~850 m · 10 min", type:"Restaurant français",      addr:"113 Rue d'Isle" },
];

restaurants.forEach((r, i) => {
  const num = i + 1;
  L.marker([r.lat, r.lng], { icon: circleMarker(r.color, num) })
    .addTo(map)
    .bindPopup(`
      <div class="popup-inner">
        <span class="popup-num" style="background:${r.color}">${num}</span>
        <h4>${r.name}</h4>
        <p class="popup-type">${r.type}</p>
        <div class="popup-dist">📍 ${r.dist} à pied</div>
        <div class="popup-addr">📌 ${r.addr}</div>
      </div>`);
});
</script>
</body>
</html>
